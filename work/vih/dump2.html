<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="o"></pre>
<script src="../../lib/three.min.js"></script><script src="helpers.js"></script><script src="model.js"></script>
<script>
const spec={id:'v',w:49,d:55,h:81,seatH:48,color:'#929683',color2:'#78846C'};

const F=30.48; let out=[],i=0;
