let _woodTexCache=null;
/* 地板：深冷灰褐宽板（对照 704/705 实拍——深烟熏橡木，偏冷灰不偏橙） */
function woodTexture(){
  if(_woodTexCache) return _woodTexCache;
  const N=1024; const c=document.createElement('canvas'); c.width=N;c.height=N;
  const g=c.getContext('2d');
  const PH=N/8;                                       // 8 块板 ≈ 板宽 18cm
  const rnd=(a,b)=>a+Math.random()*(b-a);
  g.fillStyle='#4c4643'; g.fillRect(0,0,N,N);
  for(let p=0;p<8;p++){
    const y0=p*PH;
    // 每块板独立底色（真实木地板板与板之间色差明显）
    const v=rnd(-9,9), warm=rnd(-3,4);
    const base=[Math.round(80+v+warm), Math.round(74+v), Math.round(70+v-warm*0.5)];
    g.save(); g.beginPath(); g.rect(0,y0,N,PH); g.clip();
    g.fillStyle=`rgb(${base[0]},${base[1]},${base[2]})`; g.fillRect(0,y0,N,PH);
    // 板内纵向色带（心材/边材过渡）
    for(let i=0;i<7;i++){
      const yy=y0+rnd(0,PH), hh=rnd(2,PH*0.30), d=rnd(-14,12);
      g.fillStyle=`rgba(${base[0]+d|0},${base[1]+d|0},${base[2]+d|0},.55)`;
      g.fillRect(0,yy,N,hh);
    }
    // 大教堂纹（cathedral grain）：成对内嵌拱形
    const groups=Math.round(rnd(2,4));
    for(let k=0;k<groups;k++){
      const cx=rnd(0,N), cy=y0+rnd(PH*0.2,PH*0.8), w=rnd(70,190), amp=rnd(PH*0.18,PH*0.42);
      const dark=Math.random()<0.5;
      for(let r=0;r<7;r++){
        const sc=1-r*0.11;
        g.strokeStyle=dark?`rgba(46,40,37,${rnd(0.10,0.24)})`:`rgba(132,124,117,${rnd(0.07,0.16)})`;
        g.lineWidth=rnd(0.7,2.0);
        g.beginPath();
        g.moveTo(cx-w*sc, cy+amp*sc*0.55);
        g.quadraticCurveTo(cx, cy-amp*sc, cx+w*sc, cy+amp*sc*0.55);
        g.stroke();
      }
    }
    // 细木孔/纹理线
    for(let i=0;i<90;i++){
      const yy=y0+rnd(1,PH-1), a=rnd(0.04,0.17);
      g.strokeStyle=Math.random()<0.55?`rgba(40,35,33,${a})`:`rgba(140,132,125,${a*0.8})`;
      g.lineWidth=rnd(0.4,1.3);
      const x0=rnd(-100,N), len=rnd(120,520);
      g.beginPath(); g.moveTo(x0,yy);
      g.bezierCurveTo(x0+len*0.33, yy+rnd(-2,2), x0+len*0.66, yy+rnd(-2,2), x0+len, yy+rnd(-1.5,1.5));
      g.stroke();
    }
    // 偶发节疤
    if(Math.random()<0.45){
      const kx=rnd(60,N-60), ky=y0+rnd(PH*0.25,PH*0.75), kr=rnd(3,7);
      for(let r=kr;r>0;r-=1.2){
        g.strokeStyle=`rgba(38,32,29,${0.30-r*0.02})`; g.lineWidth=1.1;
        g.beginPath(); g.ellipse(kx,ky,r*1.9,r,0,0,Math.PI*2); g.stroke();
      }
    }
    g.restore();
    // 板缝：暗缝 + 上侧微亮倒角（LVP/实木复合的微V型倒角）
    g.strokeStyle='rgba(22,18,17,.9)'; g.lineWidth=2.0;
    g.beginPath(); g.moveTo(0,y0+PH-1); g.lineTo(N,y0+PH-1); g.stroke();
    g.strokeStyle='rgba(150,142,134,.16)'; g.lineWidth=1.2;
    g.beginPath(); g.moveTo(0,y0+PH-3); g.lineTo(N,y0+PH-3); g.stroke();
    // 端缝（每块板 2 条，错缝布置）
    for(const ex of [ (p*331)%N, (p*331+N/2+97)%N ]){
      g.strokeStyle='rgba(22,18,17,.85)'; g.lineWidth=1.8;
      g.beginPath(); g.moveTo(ex,y0+1); g.lineTo(ex,y0+PH-2); g.stroke();
      g.strokeStyle='rgba(150,142,134,.12)'; g.lineWidth=1.0;
      g.beginPath(); g.moveTo(ex+2,y0+1); g.lineTo(ex+2,y0+PH-2); g.stroke();
    }
  }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(0.227,0.227);   // 8板/4.4ft ≈ 板宽17cm
  t.encoding=THREE.sRGBEncoding; t.anisotropy=8;   // 必须标 sRGB，否则被当线性图渲染而发白
  _woodTexCache=t; return t;
}

const CEIL_H = 8.8;
function wallMesh(s, h, thick, mat, ext){
  const dx=s.x2-s.x1, dy=s.y2-s.y1;
  const L=Math.hypot(dx,dy); if(L<0.01) return null;
  // ext=true 时两端各延长半个墙厚，封住斜角相接处的缝隙
  const geo = new THREE.BoxGeometry(L+(ext?thick:0), h, thick);
  const m = new THREE.Mesh(geo, mat);
  m.position.set((s.x1+s.x2)/2, h/2, (s.y1+s.y2)/2);
  m.rotation.y = -Math.atan2(dy,dx);
  m.castShadow=m.receiveShadow=true;
  return m;
}

function buildEnvironment(){
  const night = three.night;
  const tex = cityPanorama(night);
  const pm=new THREE.PMREMGenerator(three.renderer); pm.compileEquirectangularShader();
  if(three.env) three.env.dispose();
  const env=pm.fromEquirectangular(tex).texture;
  three.scene.environment=env; three.env=env;   // 环境反射两种视角都保留（玻璃/石材反射靠它）
  three.panorama=tex;
  applyBackdrop();
  pm.dispose();
}
/* 照明方案：娃娃屋=均匀泛光（看清造型与贴图，不受灯具影响）；室内=真实灯光 */
function applyLightMode(){
  if(!three) return;
  const fp = three.camMode==='fp', night = !!three.night;
  const {sun, amb, hemi, renderer} = three;
  if(!fp){                                   // 娃娃屋：柔和均匀，弱方向光只用来交代体块
    sun.color.set(0xfff4e6); sun.intensity=0.55; sun.position.copy(three.sunHome);
    amb.color.set(0xffffff); amb.intensity=0.95;
    hemi.color.set(0xdfe9f7); hemi.groundColor.set(0x9a9184); hemi.intensity=0.85;
    renderer.toneMappingExposure=0.98;
  } else if(night){
    sun.color.set(0x93a9d4); sun.intensity=0.16; sun.position.set(30,26,-34);
    amb.color.set(0x2c3550); amb.intensity=0.10;
    hemi.color.set(0x3a4d78); hemi.groundColor.set(0x14161c); hemi.intensity=0.16;
    renderer.toneMappingExposure=1.25;
  } else {
    sun.color.set(0xffeeda); sun.intensity=1.85; sun.position.copy(three.sunHome);
    amb.color.set(0xf2f4f8); amb.intensity=0.28;
    hemi.color.set(0xbfd4ff); hemi.groundColor.set(0x3a3226); hemi.intensity=0.55;
    renderer.toneMappingExposure=0.92;
  }
  const fix = fp ? 1 : 0.06;                 // 娃娃屋里灯具几乎不参与照明，避免局部过曝
  three.furnGroup.traverse(o=>{ if(o.isLight && o.userData.baseI!=null) o.intensity=o.userData.baseI*fix; });
}
/* 窗外景只在室内视角渲染；娃娃屋视角保持干净背景 */
function applyBackdrop(){
  if(!three) return;
  const fp = three.camMode==='fp';
  if(fp && three.panorama){
    three.scene.background = three.panorama;
    three.scene.fog = new THREE.Fog(three.night?0x0b1018:0xb9cfe2, 130, 430);
  } else {
    three.scene.background = new THREE.Color(three.night?0x0a0c11:0x141821);
    three.scene.fog = null;
  }
}
/* 白天 / 夜晚 */
function setDayNight(night){
  if(!three) return;
  three.night=night;
  applyLightMode();

  $('#dnNight').classList.toggle('on', night);
}

        cyl(0.045, 0.7, mChrome, cx, 2.9, y1-0.08, 10);      // 龙头立管
        const sp=box(0.05,0.05,0.34, mChrome, cx, 3.22, y1+0.06); // 出水嘴
      } else if(f.t==='toilet'){
        if(f.dir==='S'){
          const tk=F2(10.5);
          box(w, 2.55, tk, mPorc, cx, 1.275, y1+tk/2);                    // 水箱
          cyl(Math.min(w,d2-tk)*0.42, 1.15, mPorc, cx, 0.575, y1+tk+(d2-tk)*0.52, 20);
          cyl(Math.min(w,d2-tk)*0.46, 0.09, mPorcD, cx, 1.20, y1+tk+(d2-tk)*0.52, 20); // 座圈
        } else {
          const tk=F2(9.5);
          box(tk, 2.55, d2, mPorc, x2-tk/2, 1.275, cz);
          cyl(Math.min(w-tk,d2)*0.44, 1.15, mPorc, x1+(w-tk)*0.48, 0.575, cz, 20);
          cyl(Math.min(w-tk,d2)*0.48, 0.09, mPorcD, x1+(w-tk)*0.48, 1.20, cz, 20);
        }
      } else if(f.t==='tub'){
        const r=F2(3.2);
        box(w, 1.62, d2, mPorc, cx, 0.81, cz);                            // 台沿整体
        box(w-2*r, 1.34, d2-2*r, mTubIn, cx, 0.79, cz);                   // 内胆（略低）
        const fx = f.fa==='W' ? x1+F2(6.4) : x2-F2(6.4);

      } else if(f.t==='shower'){
        box(w, 0.28, d2, mPorcD, cx, 0.14, cz);                           // 淋浴盘
        const gl = new THREE.MeshPhysicalMaterial({color:0xa8c8e8, transparent:true, opacity:.2, roughness:.05});
        const pw = w*0.62;
        const pane=new THREE.Mesh(new THREE.BoxGeometry(pw,6.4,0.06), gl);
        pane.position.set(x1+pw/2, 3.2, y1+0.05); scene.add(pane);
        box(pw,0.09,0.1, mChrome, x1+pw/2, 6.45, y1+0.05);                // 顶轨
        cyl(0.05,0.8,mChrome, x2-0.35, 6.0, cz, 10);                      // 花洒立管
        box(0.55,0.06,0.55, mChrome, x2-0.62, 6.42, cz);                  // 花洒
      }
    }
  }
  // 门扇 3D：北美常见白色平板门（含杆式把手/合页/门套线）；入户门深木色
  const doorPaint = (()=>{                       // 白漆门：细腻漆面质感（非纯平）
    const N=256,c=document.createElement('canvas'); c.width=N;c.height=N;
    const g=c.getContext('2d'); g.fillStyle='#ffffff'; g.fillRect(0,0,N,N);
    for(let i=0;i<5200;i++){ const v=Math.random()<0.5?236:255;
      g.fillStyle=`rgba(${v},${v},${v},.5)`; g.fillRect(Math.random()*N,Math.random()*N,1,1); }
    for(let i=0;i<26;i++){ g.strokeStyle=`rgba(214,210,204,${0.05+Math.random()*0.06})`;
      g.lineWidth=0.6+Math.random(); const y=Math.random()*N;
      g.beginPath(); g.moveTo(0,y); g.bezierCurveTo(N*.3,y+2,N*.7,y-2,N,y); g.stroke(); }
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping;
    t.repeat.set(1.6,3.2); t.encoding=THREE.sRGBEncoding; return t;
  })();
  const matDoorW = new THREE.MeshPhysicalMaterial({map:doorPaint, normalMap:normalFromTexture(doorPaint,0.35),
    color:0xe8e5e0, roughness:.62, clearcoat:.22, clearcoatRoughness:.42, specularIntensity:.35, envMapIntensity:.22});
  const woodDoorTex = woodSpecies('walnut');
  const matDoorWood = new THREE.MeshPhysicalMaterial({map:woodDoorTex, normalMap:normalFromTexture(woodDoorTex,0.8),
    color:0x7a4f2e, roughness:.40, clearcoat:.45, clearcoatRoughness:.20, envMapIntensity:.6});
  const matHandle = new THREE.MeshStandardMaterial({color:0xb9bcc2, roughness:.22, metalness:.92, envMapIntensity:.9});
  const matCasing = new THREE.MeshPhysicalMaterial({color:0xecebe7, roughness:.68, specularIntensity:.30, envMapIntensity:.2});
  const DOOR_H = 6.7;
  /* 杆式把手（锁芯圆盘 + L 形把手），装在门扇两面 */
  const addLever=(px,pz,u,n,side,y)=>{
    const rose=new THREE.Mesh(new THREE.CylinderGeometry(0.19,0.19,0.05,20), matHandle);
    rose.position.set(px+n[0]*side*0.075, y, pz+n[1]*side*0.075);
    rose.rotation.z=Math.PI/2; rose.rotation.y=-Math.atan2(n[1],n[0]);
    rose.castShadow=true; scene.add(rose);
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.16,12), matHandle);
    stem.position.set(px+n[0]*side*0.14, y, pz+n[1]*side*0.14);
    stem.rotation.z=Math.PI/2; stem.rotation.y=-Math.atan2(n[1],n[0]);
    scene.add(stem);
    const lev=new THREE.Mesh(new THREE.CapsuleGeometry(0.052,0.34,4,10), matHandle);   // 横向把杆
    lev.position.set(px+n[0]*side*0.20 - u[0]*0.17, y, pz+n[1]*side*0.20 - u[1]*0.17);
    lev.rotation.z=Math.PI/2; lev.rotation.y=-Math.atan2(u[1],u[0]);
    lev.castShadow=true; scene.add(lev);
  };
  for(const d of effDoors()){
    const g=doorGeom(d), wood=d.wood, mat=wood?matDoorWood:matDoorW;
    const TH=0.14;
    const mkPanel=(cx,cy,len,thick,dir)=>{                    // 门扇：圆角板 + 四周细收边
      const ang=-Math.atan2(dir[1],dir[0]);
      const m=new THREE.Mesh(rboxGeo(len, DOOR_H, thick, 0.012, 2), mat);
      m.position.set(cx, DOOR_H/2, cy); m.rotation.y=ang;
      m.castShadow=m.receiveShadow=true; scene.add(m);
      const edge=new THREE.Mesh(new THREE.BoxGeometry(len*0.995, 0.02, thick*1.04),
        new THREE.MeshStandardMaterial({color:wood?0x5f3d23:0xd9d6d0, roughness:.7}));
      edge.position.set(cx, DOOR_H-0.012, cy); edge.rotation.y=ang; scene.add(edge);
      return m;
    };
    /* 门套线：洞口两侧各一圈平板套线（照片里就是这种极简平线脚） */
    {
      const cw=0.30, ct=0.055, jamb=0.40;
      for(const side of [-1,1]){
        const off=[g.n[0]*side*(jamb/2+ct/2), g.n[1]*side*(jamb/2+ct/2)];
        for(const [ex,ey] of [[d.x1,d.y1],[d.x2,d.y2]]){       // 竖套线
          const c1=new THREE.Mesh(new THREE.BoxGeometry(cw, DOOR_H+0.30, ct), matCasing);
          c1.position.set(ex+off[0]+g.u[0]*0, (DOOR_H+0.30)/2, ey+off[1]);
          c1.rotation.y=-Math.atan2(g.n[1]*side, g.n[0]*side)+Math.PI/2;
          c1.castShadow=c1.receiveShadow=true; scene.add(c1);
        }
        const top=new THREE.Mesh(new THREE.BoxGeometry(g.L+cw*1.2, cw, ct), matCasing);
        const mx=(d.x1+d.x2)/2+off[0], mz=(d.y1+d.y2)/2+off[1];
        top.position.set(mx, DOOR_H+0.30-cw/2, mz);
        top.rotation.y=-Math.atan2(g.u[1],g.u[0]);
        top.castShadow=true; scene.add(top);
      }
    }
    if(d.kind==='slide'){
      const a=[d.x1,d.y1];
      const mid=(t0,t1)=>[(a[0]+g.u[0]*g.L*(t0+t1)/2), (a[1]+g.u[1]*g.L*(t0+t1)/2)];
      let c=mid(0,0.55);  const p1=mkPanel(c[0]+g.n[0]*0.09, c[1]+g.n[1]*0.09, g.L*0.55, 0.10, g.u);
      c=mid(0.45,1);      mkPanel(c[0]-g.n[0]*0.09, c[1]-g.n[1]*0.09, g.L*0.55, 0.10, g.u);
      const rail=new THREE.Mesh(new THREE.BoxGeometry(g.L+0.1, 0.10, 0.30), matHandle);  // 上轨
      rail.position.set((d.x1+d.x2)/2, DOOR_H+0.10, (d.y1+d.y2)/2);
      rail.rotation.y=-Math.atan2(g.u[1],g.u[0]); scene.add(rail);
      for(const t of [0.30, 0.74]){                                                       // 竖向嵌入把手
        const px=d.x1+g.u[0]*g.L*t, pz=d.y1+g.u[1]*g.L*t;
        const h=new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.9, 0.09), matHandle);
        h.position.set(px+g.n[0]*0.14, 3.3, pz+g.n[1]*0.14);
        h.rotation.y=-Math.atan2(g.u[1],g.u[0]); scene.add(h);
      }
    } else if(d.kind==='bifold'){
      for(const sg of bifoldZig(d)){
        const c=[(sg[0][0]+sg[1][0])/2,(sg[0][1]+sg[1][1])/2];
        const dv=[sg[1][0]-sg[0][0], sg[1][1]-sg[0][1]];
        const L=Math.hypot(dv[0],dv[1]);
        mkPanel(c[0],c[1],L*0.97,0.085,dv);
        const nn=[dv[1]/L, -dv[0]/L];
        const kb=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.10,12), matHandle);
        kb.position.set(c[0]+nn[0]*0.07, 3.3, c[1]+nn[1]*0.07);
        kb.rotation.z=Math.PI/2; kb.rotation.y=-Math.atan2(nn[1],nn[0]); scene.add(kb);
      }
    } else {
      const c45=Math.cos(Math.PI/4), s45=Math.sin(Math.PI/4);
      const leaf=(H,w,Lp)=>{
        const dir=[w[0]*c45+g.n[0]*s45, w[1]*c45+g.n[1]*s45];
        const c=[H[0]+dir[0]*Lp/2, H[1]+dir[1]*Lp/2];
        mkPanel(c[0],c[1],Lp,TH,dir);
        const pn=[dir[1],-dir[0]];
        const hx=H[0]+dir[0]*Lp*0.86, hz=H[1]+dir[1]*Lp*0.86;
        addLever(hx,hz,dir,pn, 1, 3.0);          // 两面都有把手
        addLever(hx,hz,dir,pn,-1, 3.0);
        for(const hy of [0.9, DOOR_H*0.5, DOOR_H-0.9]){                       // 合页
          const hg=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.34,10), matHandle);
          hg.position.set(H[0]-dir[0]*0.02+pn[0]*0.05, hy, H[1]-dir[1]*0.02+pn[1]*0.05);
          hg.castShadow=true; scene.add(hg);
        }
      };
      if(d.kind==='double'){
        leaf([d.x1,d.y1], g.u, g.L/2-0.04);
        leaf([d.x2,d.y2], [-g.u[0],-g.u[1]], g.L/2-0.04);
      } else {
        const H=g.H, T=g.T;
        const w=[(T[0]-H[0])/g.L,(T[1]-H[1])/g.L];
        leaf(H, w, Math.max(0.2,g.L-0.08));
      }
    }
  }
  // INNER 是挂杆等示意虚线，不在 3D 中成墙
  // 结构墙块（与 2D FIXED 同源：柱/阶梯墙/墙带/楔形/北墙厚带等）
  for(const f of effFixed()){
    if(f.fill!=='#0c0d0f' && f.fill!=='#15171a') continue;
    const sh = new THREE.Shape();
    sh.moveTo(f.poly[0][0], f.poly[0][1]);
    for(let i=1;i<f.poly.length;i++) sh.lineTo(f.poly[i][0], f.poly[i][1]);
    sh.closePath();
    const g = new THREE.ExtrudeGeometry(sh,{depth:CEIL_H-0.004*((wk++)%6), bevelEnabled:false});
    const m = new THREE.Mesh(g, matWall);
    m.rotation.x = Math.PI/2; m.position.y = CEIL_H;
    m.castShadow = m.receiveShadow = true;
    scene.add(m);
  }
  // 厨房台面+柜
  const matCab = new THREE.MeshPhysicalMaterial({map:grayOakTexture(), normalMap:normalFromTexture(grayOakTexture(),0.7),
    color:0xffffff, roughness:.52, clearcoat:.28, clearcoatRoughness:.30, envMapIntensity:.55});
  const matTop = new THREE.MeshPhysicalMaterial({map:quartzTexture(), color:0xe9e7e2, roughness:.18, metalness:.02,
    clearcoat:.5, clearcoatRoughness:.10, envMapIntensity:.8});
  const kc = new THREE.Mesh(new THREE.BoxGeometry(9.6, 3.0, 2.41), matCab);
  kc.position.set(26.18, 1.5, 14.33); kc.castShadow=true; scene.add(kc);
  // 冰箱（不锈钢双门）
  const matSteel = new THREE.MeshStandardMaterial({color:0xc9ccd0, roughness:.38, metalness:1.0,
    roughnessMap:brushedSteelTexture(), envMapIntensity:1.0});   // 真不锈钢：全金属+拉丝
  const mChromeF = new THREE.MeshStandardMaterial({color:0xd2d5da, roughness:.25, metalness:.85});
  const FW=2.95, FCX=19.83;                                    // 法式双开门冰箱 90cm 宽
  const fridge = new THREE.Mesh(new THREE.BoxGeometry(FW, 5.95, 2.45), matSteel);
  fridge.position.set(FCX, 2.975, 14.5); fridge.castShadow=true; scene.add(fridge);
  const mSeam = new THREE.MeshStandardMaterial({color:0x5a5f65, roughness:.5, metalness:.4});
  const fseam = new THREE.Mesh(new THREE.BoxGeometry(0.035, 3.6, 0.04), mSeam);   // 上部对开门中缝
  fseam.position.set(FCX, 4.1, 15.74); scene.add(fseam);
  const fdrw = new THREE.Mesh(new THREE.BoxGeometry(FW-0.06, 0.04, 0.04), mSeam); // 下方冷冻抽屉分缝
  fdrw.position.set(FCX, 2.28, 15.74); scene.add(fdrw);
  for(const hx of [FCX-0.14, FCX+0.14]){                                          // 双开门竖把手
    const h=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,2.7,10), mChromeF);
    h.position.set(hx, 4.3, 15.85); scene.add(h);
  }
  const fh=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,FW-0.5,10), mChromeF);
  fh.rotation.z=Math.PI/2; fh.position.set(FCX, 1.5, 15.85); scene.add(fh);       // 冷冻抽屉横把手
  // 灶台黑面板
  const cook = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.04, 1.9), new THREE.MeshStandardMaterial({color:0x15171a, roughness:.25}));
  cook.position.set(23.4, 3.18, 14.33); scene.add(cook);
  const kt = new THREE.Mesh(new THREE.BoxGeometry(9.72, .16, 2.53), matTop);
  kt.position.set(26.16, 3.08, 14.33); scene.add(kt);
  const uc = new THREE.Mesh(new THREE.BoxGeometry(12.6, 2.6, 1.3), matCab);
  uc.position.set(25.18, 6.5, 13.78); scene.add(uc);
  // 中岛（船形轮廓拉伸）
  const isS = new THREE.Shape();
  isS.moveTo(ISL.a[0],ISL.a[1]); isS.lineTo(ISL.b[0],ISL.b[1]);
  isS.lineTo(ISL.e[0],ISL.e[1]);
  isS.quadraticCurveTo(ISL.cp2[0],ISL.cp2[1],ISL.d[0],ISL.d[1]);
  isS.closePath();
  const isGeo = new THREE.ExtrudeGeometry(isS,{depth:3.0, bevelEnabled:false});
  const island = new THREE.Mesh(isGeo, matCab);
  island.rotation.x=Math.PI/2; island.position.y=3.0; island.castShadow=true;
  scene.add(island);
  // 台面：沿轮廓法向等距外挑 3cm（不能用 scale——那是绕世界原点缩放，会把台面整体平移）
  const isPts = isS.getPoints(72).map(p=>[p.x,p.y]);
  if(Math.hypot(isPts[0][0]-isPts[isPts.length-1][0], isPts[0][1]-isPts[isPts.length-1][1])<1e-6) isPts.pop();
  let area2=0;
  for(let i=0;i<isPts.length;i++){ const j=(i+1)%isPts.length;
    area2 += isPts[i][0]*isPts[j][1] - isPts[j][0]*isPts[i][1]; }
  const sgn = area2>0 ? 1 : -1;                      // 保证法向朝外
  const OVH = 0.1;                                   // 外挑 3cm
  const isOff = isPts.map((p,i)=>{
    const a=isPts[(i-1+isPts.length)%isPts.length], b=isPts[(i+1)%isPts.length];
    const n1=[(p[1]-a[1]),-(p[0]-a[0])], n2=[(b[1]-p[1]),-(b[0]-p[0])];
    const l1=Math.hypot(n1[0],n1[1])||1, l2=Math.hypot(n2[0],n2[1])||1;
    let nx=(n1[0]/l1+n2[0]/l2), ny=(n1[1]/l1+n2[1]/l2);
    const ln=Math.hypot(nx,ny)||1; nx/=ln; ny/=ln;
    return new THREE.Vector2(p[0]+nx*OVH*sgn, p[1]+ny*OVH*sgn);
  });
  const isTopGeo = new THREE.ExtrudeGeometry(new THREE.Shape(isOff),{depth:.13, bevelEnabled:false});
  const isTop = new THREE.Mesh(isTopGeo, matTop);
  isTop.rotation.x=Math.PI/2; isTop.position.y=3.15; isTop.castShadow=true; isTop.receiveShadow=true;
  scene.add(isTop);
  applyBackdrop();   // 雾与背景由视角模式统一决定
}
/* =====================================================================
   照片级渲染：渐进式累积
   每帧抖动相机子像素(抗锯齿) + 在锥内抖动太阳方向(面光源软阴影)
   + 抖动天光方向(近似环境遮蔽/漫反射)，多帧平均得到收敛画面
   ===================================================================== */
function photoRender(samples){
  if(!three || three.photo) return;
  samples = samples || 220;
  const {renderer, scene, cam, canvas, sun, amb, hemi} = three;
  const W=canvas.clientWidth||canvas.width, H=canvas.clientHeight||canvas.height;
  const dpr=Math.min(devicePixelRatio||1, 2);
  const rw=Math.max(64,Math.round(W*dpr)), rh=Math.max(64,Math.round(H*dpr));
  // GPU 浮点累积：逐帧渲染到 HDR 目标并叠加，最后一次性做 ACES + sRGB（无逐帧 CPU 回读）
  const opts={type:THREE.HalfFloatType, format:THREE.RGBAFormat,
              minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter, depthBuffer:true};
  const rt   = new THREE.WebGLRenderTarget(rw,rh,opts);
  const accRT= new THREE.WebGLRenderTarget(rw,rh,Object.assign({},opts,{depthBuffer:false}));
  const oCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  const VS='varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }';
  const addMat=new THREE.ShaderMaterial({uniforms:{tSrc:{value:rt.texture}},
    vertexShader:VS, fragmentShader:'uniform sampler2D tSrc; varying vec2 vUv; void main(){ gl_FragColor=vec4(texture2D(tSrc,vUv).rgb,1.0); }',
    blending:THREE.AdditiveBlending, depthTest:false, depthWrite:false, transparent:true});
  const resMat=new THREE.ShaderMaterial({uniforms:{tAcc:{value:accRT.texture}, uN:{value:1}, uExp:{value:renderer.toneMappingExposure}},
    vertexShader:VS, fragmentShader:`
      uniform sampler2D tAcc; uniform float uN; uniform float uExp; varying vec2 vUv;
      vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }
      void main(){ vec3 c=texture2D(tAcc,vUv).rgb/max(uN,1.0);
        c=aces(c*uExp);
        c=mix(c*12.92, 1.055*pow(max(c,vec3(0.0031308)),vec3(1.0/2.4))-0.055, step(vec3(0.0031308),c));
        gl_FragColor=vec4(c,1.0); }`,
    depthTest:false, depthWrite:false});
  const quadScene=new THREE.Scene();
  const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2), addMat); quad.frustumCulled=false;
  quadScene.add(quad);
  const saved={ sunPos:sun.position.clone(), sunInt:sun.intensity, ambInt:amb.intensity,
                hemiInt:hemi.intensity, autoClear:renderer.autoClear, pr:renderer.getPixelRatio() };
  const bar=$('#photoBar'), lbl=$('#photoTxt');
  bar.style.display='flex';
  renderer.setRenderTarget(accRT); renderer.setClearColor(0x000000,1); renderer.clear(true,true,true);
  renderer.setRenderTarget(null);
  let i=0, cancelled=false;
  three.photo={cancel(){ cancelled=true; }};
  const R2=(a,b)=>a+Math.random()*(b-a);
  const CTRV=new THREE.Vector3(26,0,20);
  const baseSun=saved.sunInt, baseAmb=saved.ambInt, baseHemi=saved.hemiInt;
  const t0=performance.now();
  const step=()=>{
    if(cancelled){ finish(true); return; }
    const budget=90;                       // 每帧最多占用 90ms，保持界面可响应
    const fs=performance.now();
    while(i<samples && performance.now()-fs<budget){
      cam.setViewOffset(rw, rh, R2(-0.5,0.5), R2(-0.5,0.5), rw, rh);   // 子像素抖动=抗锯齿
      if(i%3===2){        // 天光采样：随机半球方向、低强度 → 累积出环境遮蔽与柔和漫射
        const th=R2(0,Math.PI*2), ph=R2(0.30,1.35);
        sun.position.set(Math.cos(th)*Math.cos(ph)*55, Math.sin(ph)*55+8, Math.sin(th)*Math.cos(ph)*55).add(CTRV);
        sun.intensity=baseSun*0.40; amb.intensity=baseAmb*0.30; hemi.intensity=baseHemi*1.6;
      } else {            // 日光采样：在锥内抖动方向 → 真实半影软阴影
        const j=0.9;

      renderer.setRenderTarget(accRT);

function roundedRectShape(w,h,r){
  const s=new THREE.Shape(), x=-w/2, y=-h/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y);
  return s;
}
const _rboxCache={};
function rboxGeo(w,h,d,r,seg){
  r=Math.max(0.006, Math.min(r, w/2-0.004, h/2-0.004, d/2-0.004));
  const key=[w,h,d,r,seg||3].map(v=>v.toFixed(3)).join('_');
  if(_rboxCache[key]) return _rboxCache[key];
  const geo=new THREE.ExtrudeGeometry(roundedRectShape(w,h,r),
    {depth:Math.max(0.004,d-2*r), bevelEnabled:true, bevelSize:r, bevelThickness:r,
     bevelSegments:(seg||3), curveSegments:8, steps:1});
  geo.center(); geo.computeVertexNormals();

}

  }
  C.box(C.cm(1.2), t*0.96, C.d, edge, 0, 0, 0);
  for(const sz of [-1,1]) C.box(C.w, C.cm(0.5), C.cm(0.8), edge, 0, C.cm(0.3), sz*(hd-C.cm(0.4)));

function furn3D(it, spec){

  const col = new THREE.Color(itemColor(it));
  const mat = new THREE.MeshStandardMaterial({color:col, roughness:.85});
  const matD = new THREE.MeshStandardMaterial({color:col.clone().multiplyScalar(.75), roughness:.85});
  const g = new THREE.Group();
  const box=(w,h,d,m,x=0,y=0,z=0)=>{
    const mm=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m||mat);
    mm.position.set(x,y+h/2,z); mm.castShadow=mm.receiveShadow=true; g.add(mm); return mm;
  };

    const mm=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24), m||mat);
    mm.position.set(x,y+h/2,z); mm.castShadow=true; g.add(mm); return mm;
  };

      fab:  new THREE.MeshStandardMaterial({map:fabricTexture(), color:col, roughness:.95, envMapIntensity:.25}),
      fabD: new THREE.MeshStandardMaterial({map:fabricTexture(), color:col.clone().multiplyScalar(.86), roughness:.95, envMapIntensity:.25}),
      wood: (()=>{ const tx=woodSpecies(spec.wood||'oak');
              return new THREE.MeshPhysicalMaterial({map:tx, normalMap:normalFromTexture(tx,0.85),
                color:col, roughness:.40, clearcoat:.40, clearcoatRoughness:.20, envMapIntensity:.7}); })(),
      chrome:new THREE.MeshStandardMaterial({color:0xc6cad0, roughness:.14, metalness:.94}),
      steel: new THREE.MeshStandardMaterial({color:0x9aa0a6, roughness:.35, metalness:.75}),
      black: new THREE.MeshStandardMaterial({color:0x24262a, roughness:.44, metalness:.5}),
      white: new THREE.MeshStandardMaterial({color:0xeeece7, roughness:.55}),
      plastic:new THREE.MeshStandardMaterial({color:0x33363b, roughness:.6}),

      // 只有嵌入式筒灯额外叠一盏"宽角+高半影"的下照光模拟灯杯，且仍保留大量泛光。

  }
  // —— 高精度材质：织物有织纹、木材有木纹、金属分哑光/镀铬 ——
  const matWood = new THREE.MeshStandardMaterial({map:furnWoodTexture(), color:0x8a6b4a, roughness:.62});
  const matFab  = new THREE.MeshStandardMaterial({map:fabricTexture(), color:col, roughness:.95, envMapIntensity:.25});
  const matFabD = new THREE.MeshStandardMaterial({map:fabricTexture(), color:col.clone().multiplyScalar(.88), roughness:.95, envMapIntensity:.25});
  const matPipe = new THREE.MeshStandardMaterial({color:col.clone().multiplyScalar(.78), roughness:.9});
  const matChrome=new THREE.MeshStandardMaterial({color:0xc6cad0, roughness:.16, metalness:.92});
  const matBlackMet=new THREE.MeshStandardMaterial({color:0x2a2c30, roughness:.42, metalness:.55});
  // —— 造型基元 ——
  const rb=(w,h,d,r,m,x=0,y=0,z=0,seg)=>{                 // 圆角体（y 为底部对齐）
    const mm=new THREE.Mesh(rboxGeo(w,h,d,r,seg), m||mat);
    mm.position.set(x,y+h/2,z); mm.castShadow=mm.receiveShadow=true; g.add(mm); return mm;
  };
  const cushion=(w,h,d,m,x,y,z,crown)=>{                  // 软包坐垫：圆角+顶面微鼓+四周走线
    const c=rb(w,h,d,Math.min(h*0.42,cm2ft(4.5)),m,x,y,z,4);
    c.scale.y=1; c.geometry=c.geometry;
    const cr=(crown==null?0.035:crown);
    const top=new THREE.Mesh(rboxGeo(w*0.94,h*0.5,d*0.94,Math.min(h*0.3,cm2ft(4)),3), m||mat);
    top.position.set(x, y+h+cr-h*0.25, z); top.castShadow=true; g.add(top);   // 隆起
    const seam=new THREE.Mesh(rboxGeo(w+0.012,cm2ft(1.0),d+0.012,cm2ft(0.5),2), matPipe);
    seam.position.set(x, y+h*0.5, z); g.add(seam);                            // 包边走线
    return c;
  };
  const legT=(topR,botR,h,m,x,z,tilt)=>{                  // 锥形腿（可外撇）
    const mm=new THREE.Mesh(new THREE.CylinderGeometry(botR,topR,h,14), m||matWood);
    mm.position.set(x,h/2,z); mm.castShadow=true;
    if(tilt){ mm.rotation.z=-Math.sign(x)*tilt; mm.rotation.x=Math.sign(z)*tilt; }
    g.add(mm); return mm;
  };
  const tube=(len,r,m,x,y,z,axis)=>{                      // 圆管（端头半球）
    const mm=new THREE.Mesh(new THREE.CapsuleGeometry(r,Math.max(0.01,len-2*r),4,12), m||matBlackMet);
    mm.position.set(x,y,z);
    if(axis==='x') mm.rotation.z=Math.PI/2;
    if(axis==='z') mm.rotation.x=Math.PI/2;
    mm.castShadow=true; g.add(mm); return mm;
  };
  const knob=(r,m,x,y,z)=>{ const mm=new THREE.Mesh(new THREE.SphereGeometry(r,16,12), m||matChrome);
    mm.position.set(x,y,z); mm.castShadow=true; g.add(mm); return mm; };
  const barHandle=(len,r,m,x,y,z)=>{                      // 长条拉手（含两个支脚）
    tube(len,r,m,x,y,z,'x');
    for(const sx of [-1,1]) tube(r*3.2, r*0.8, m, x+sx*(len/2-r*1.5), y-r*1.4, z, 'y');
  };
  const matMetal = new THREE.MeshStandardMaterial({color:0x888a8f, roughness:.4, metalness:.6});
  const mat2 = new THREE.MeshStandardMaterial({color:col2||col, roughness:.9});
  const matWhite = new THREE.MeshStandardMaterial({color:0xf0eee8, roughness:.6});
  switch(kind){
    case 'sofa': case 'sofaL': {
      const legH=cm2ft(spec.legH||16), armW=cm2ft(15), seatH=cm2ft(spec.seatH||44);
      const baseH=seatH-legH-cm2ft(13);
      // 木腿（微外撇）
      for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]])
        legT(cm2ft(3.4), cm2ft(2.2), legH, matWood, sx*(wf/2-armW*0.55), sz*(df/2-cm2ft(9)), 0.05);
      rb(wf-cm2ft(2), baseH, df-cm2ft(3), cm2ft(2), matFabD, 0, legH);              // 底座箱体
      // 扶手：圆角方枕，外侧略收
      for(const sx of [-1,1]){
        rb(armW, seatH+cm2ft(20)-legH, df-cm2ft(2), cm2ft(6), matFab, sx*(wf/2-armW/2), legH, 0, 4);
        rb(armW*0.86, cm2ft(4), df-cm2ft(6), cm2ft(1.8), matPipe, sx*(wf/2-armW/2), seatH+cm2ft(18), 0);
      }
      // 座垫：按宽度分 2~3 块，块间留缝
      const innerW=wf-armW*2-cm2ft(2), nS=innerW>cm2ft(180)?3:2;
      const cw=(innerW-cm2ft(1.5)*(nS-1))/nS, cd=df-cm2ft(22), ch=cm2ft(14);
      for(let i=0;i<nS;i++)
        cushion(cw, ch, cd, matFab, -innerW/2+cw/2+i*(cw+cm2ft(1.5)), seatH-ch, cm2ft(5));
      // 靠背垫：略后倾、顶部微鼓
      const bh=cm2ft(38), bd2=cm2ft(17);
      for(let i=0;i<nS;i++){
        const bk=cushion(cw, bh, bd2, matFab, -innerW/2+cw/2+i*(cw+cm2ft(1.5)), seatH-cm2ft(2), -df/2+bd2/2+cm2ft(3));
        bk.rotation.x=-0.13;
      }
      if(kind==='sofaL'){                                                            // 贵妃榻
        const chL=cm2ft(78);
        rb(chL, baseH, df*0.62, cm2ft(2), matFabD, wf/2-chL/2, legH, df*0.5);
        cushion(chL-cm2ft(4), ch, df*0.58, matFab, wf/2-chL/2, seatH-ch, df*0.5);
        legT(cm2ft(3.4), cm2ft(2.2), legH, matWood, wf/2-cm2ft(10), df*0.75, 0.05);
        legT(cm2ft(3.4), cm2ft(2.2), legH, matWood, wf/2-chL+cm2ft(10), df*0.75, 0.05);
      }
      break;
    }
    case 'tableFold': case 'tableDrawer': {          // IKEA PS 2026 松木桌（含带抽屉款）
      const ptx=woodSpecies('pine');
      const pine=new THREE.MeshPhysicalMaterial({map:ptx, normalMap:normalFromTexture(ptx,0.9),
        color:0xdcbb8c, roughness:.38, clearcoat:.45, clearcoatRoughness:.18, envMapIntensity:.7});
      const pineD=new THREE.MeshPhysicalMaterial({map:ptx, normalMap:normalFromTexture(ptx,0.9),
        color:0xcaa87b, roughness:.42, clearcoat:.40, clearcoatRoughness:.22, envMapIntensity:.6});
      const tt=cm2ft(3.4);
      box(wf, tt, df, pine, 0, hf-tt);                                  // 桌面
      const lg=cm2ft(5);
      for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]])
        box(lg, hf-tt, lg, pineD, sx*(wf/2-cm2ft(6)), 0, sz*(df/2-cm2ft(6)));
      box(wf-cm2ft(16), cm2ft(4), cm2ft(3), pineD, 0, hf-tt-cm2ft(9), -df/2+cm2ft(7));  // 横撑
      box(wf-cm2ft(16), cm2ft(4), cm2ft(3), pineD, 0, hf-tt-cm2ft(9),  df/2-cm2ft(7));
      if(kind==='tableDrawer'){
        const dw=Math.min(wf*0.42, cm2ft(46));
        box(dw, cm2ft(11), cm2ft(2), pine, 0, hf-tt-cm2ft(13), df/2-cm2ft(1));          // 抽屉面板
        cyl(cm2ft(1.6), cm2ft(3), pineD, 0, hf-tt-cm2ft(8), df/2+cm2ft(1)).rotation.x=Math.PI/2;
      }
      break;
    }
    case 'crib': {                                    // SNIGLAR 婴儿床：栏杆围合
      const btx=woodSpecies('beech');
      const beech=new THREE.MeshPhysicalMaterial({map:btx, normalMap:normalFromTexture(btx,0.8),
        color:0xdcc49b, roughness:.5, clearcoat:.12, clearcoatRoughness:.4, envMapIntensity:.5});
      const wht=new THREE.MeshStandardMaterial({color:0xf2f0ea, roughness:.85});
      const post=cm2ft(5);
      for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]])
        box(post, hf, post, beech, sx*(wf/2-post/2), 0, sz*(df/2-post/2));
      const railY=[cm2ft(30), hf-cm2ft(4)];
      for(const ry of railY){                                            // 上下横档
        box(wf-post, cm2ft(4), cm2ft(3), beech, 0, ry, -df/2+post/2);
        box(wf-post, cm2ft(4), cm2ft(3), beech, 0, ry,  df/2-post/2);
        box(cm2ft(3), cm2ft(4), df-post, beech, -wf/2+post/2, ry, 0);
        box(cm2ft(3), cm2ft(4), df-post, beech,  wf/2-post/2, ry, 0);
      }
      const nL=Math.round((wf-post)/cm2ft(7));                           // 长边栏杆
      for(let i=1;i<nL;i++){ const x=-wf/2+post/2 + (wf-post)*i/nL;
        box(cm2ft(2.4), hf-cm2ft(34), cm2ft(2.4), beech, x, cm2ft(32), -df/2+post/2);
        box(cm2ft(2.4), hf-cm2ft(34), cm2ft(2.4), beech, x, cm2ft(32),  df/2-post/2); }
      const nS=Math.round((df-post)/cm2ft(7));                           // 短边栏杆
      for(let i=1;i<nS;i++){ const z=-df/2+post/2 + (df-post)*i/nS;
        box(cm2ft(2.4), hf-cm2ft(34), cm2ft(2.4), beech, -wf/2+post/2, cm2ft(32), z);
        box(cm2ft(2.4), hf-cm2ft(34), cm2ft(2.4), beech,  wf/2-post/2, cm2ft(32), z); }
      box(wf-post*1.4, cm2ft(10), df-post*1.4, wht, 0, cm2ft(22));       // 床垫
      break;
    }
    case 'playCouch': {                               // Figgy 儿童模块沙发：厚软块
      const fab=new THREE.MeshStandardMaterial({color:col, roughness:.95});
      const fabD=new THREE.MeshStandardMaterial({color:col.clone().multiplyScalar(.86), roughness:.95});
      const seatH=cm2ft(23);
      box(wf, seatH, df, fab, 0, 0);                                     // 座基（两块拼）
      box(wf*0.5-cm2ft(1), seatH*1.02, df, fabD, -wf*0.25, 0);
      box(wf, cm2ft(26), cm2ft(20), fab, 0, seatH, -df/2+cm2ft(10));     // 靠背
      for(const sx of [-1,1])                                            // 侧枕
        box(cm2ft(20), cm2ft(20), df-cm2ft(18), fabD, sx*(wf/2-cm2ft(10)), seatH, cm2ft(6));
      break;
    }
    case 'chair': {                                   // 餐椅：钢管框架 + 软包座面靠背
      const frameM=new THREE.MeshStandardMaterial({color:col, roughness:.45, metalness:.45});
      const padM=new THREE.MeshStandardMaterial({color:col2||col, roughness:.92});
      const sh=cm2ft(spec.seatH||46), t=cm2ft(2.2);
      for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]])
        box(t, sh, t, frameM, sx*(wf/2-t), 0, sz*(df/2-t));
      for(const sz of [-1,1]) box(wf-t*2, t, t, frameM, 0, sh-cm2ft(12), sz*(df/2-t));   // 横撑
      box(wf-cm2ft(1), cm2ft(5), df-cm2ft(4), padM, 0, sh-cm2ft(5));                     // 座面
      const bk=box(wf-cm2ft(3), hf-sh-cm2ft(4), cm2ft(5), padM, 0, sh, -df/2+cm2ft(4));  // 靠背
      bk.rotation.x=-0.10;
      box(t, hf-sh, t, frameM, -wf/2+t, sh, -df/2+t); box(t, hf-sh, t, frameM, wf/2-t, sh, -df/2+t);
      break;
    }
    case 'swivelChair': {                             // 旋转椅：星型底座 + 气杆
      const met=new THREE.MeshStandardMaterial({color:col2||new THREE.Color(0x8e9297), roughness:.35, metalness:.7});
      const fab=new THREE.MeshStandardMaterial({color:col, roughness:.92});
      const seatH=cm2ft(spec.seatH||45);
      for(let i=0;i<5;i++){ const a=i*Math.PI*2/5;
        const arm=box(wf*0.44, cm2ft(3), cm2ft(4.5), met, Math.cos(a)*wf*0.20, cm2ft(3), Math.sin(a)*wf*0.20);
        arm.rotation.y=-a;
        cyl(cm2ft(2.4), cm2ft(5), met, Math.cos(a)*wf*0.40, 0, Math.sin(a)*wf*0.40); }
      cyl(cm2ft(3), seatH-cm2ft(9), met, 0, cm2ft(5));                   // 气杆
      cyl(wf*0.44, cm2ft(11), fab, 0, seatH-cm2ft(6));                   // 座面（圆桶形）
      const bk=box(wf*0.82, cm2ft(38), cm2ft(11), fab, 0, seatH+cm2ft(4), -df/2+cm2ft(11));
      bk.rotation.x=-0.12;
      break;
    }
    case 'deskSitStand': {                            // IDÅSEN 升降桌：T 形腿 + 方管立柱
      const blk=new THREE.MeshStandardMaterial({color:col, roughness:.5, metalness:.35});
      const top=new THREE.MeshStandardMaterial({color:col2||col, roughness:.6});
      box(wf, cm2ft(2.6), df, top, 0, hf-cm2ft(2.6));
      for(const sx of [-1,1]){
        const x=sx*(wf/2-cm2ft(14));
        box(cm2ft(58), cm2ft(4.5), cm2ft(6.5), blk, x, 0, 0).rotation.y=Math.PI/2;   // 底脚
        box(cm2ft(9), hf-cm2ft(9), cm2ft(9), blk, x, cm2ft(4.5));                    // 立柱（外）
        box(cm2ft(6.4), hf-cm2ft(20), cm2ft(6.4), new THREE.MeshStandardMaterial({color:0x3a3d42,roughness:.45,metalness:.4}), x, cm2ft(14));
        box(cm2ft(46), cm2ft(4.5), cm2ft(6.5), blk, x, hf-cm2ft(7.6), 0).rotation.y=Math.PI/2;
      }
      box(wf-cm2ft(40), cm2ft(4), cm2ft(5), blk, 0, hf-cm2ft(9), -df/2+cm2ft(9));    // 横梁
      break;
    }
    case 'cart': {                                    // RÅSKOG 推车：三层 + 脚轮
      const met=new THREE.MeshStandardMaterial({color:col, roughness:.55, metalness:.25});
      const blk=new THREE.MeshStandardMaterial({color:col2||new THREE.Color(0x2a2c30), roughness:.6});
      const tiers=[cm2ft(12), hf*0.52, hf-cm2ft(12)];
      for(const ty of tiers){
        box(wf, cm2ft(1.6), df, met, 0, ty);                              // 层板
        for(const sz of [-1,1]) box(wf, cm2ft(6), cm2ft(1.4), met, 0, ty+cm2ft(1.6), sz*(df/2-cm2ft(.7)));
        for(const sx of [-1,1]) box(cm2ft(1.4), cm2ft(6), df, met, sx*(wf/2-cm2ft(.7)), ty+cm2ft(1.6), 0);
      }
      for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
        cyl(cm2ft(1.1), hf-cm2ft(6), met, sx*(wf/2-cm2ft(3)), cm2ft(6), sz*(df/2-cm2ft(3)));
        cyl(cm2ft(2.4), cm2ft(2.2), blk, sx*(wf/2-cm2ft(3)), cm2ft(1.4), sz*(df/2-cm2ft(3))).rotation.z=Math.PI/2;
      }
      box(wf-cm2ft(10), cm2ft(1.6), cm2ft(1.6), met, 0, hf-cm2ft(1.6), -df/2+cm2ft(3)); // 推把
      break;
    }
    case 'shelf': {                                   // KALLAX 格子架
      const bd=new THREE.MeshStandardMaterial({color:col, roughness:.62});
      const bdI=new THREE.MeshStandardMaterial({color:col.clone().multiplyScalar(.9), roughness:.7});
      const T=cm2ft(3.9);
      const cols=Math.max(1,Math.round(wf/cm2ft(39))), rows=Math.max(1,Math.round(hf/cm2ft(39)));
      box(wf, hf, T, bdI, 0, 0, -df/2+T/2);                               // 背板
      box(T, hf, df, bd, -wf/2+T/2, 0);  box(T, hf, df, bd, wf/2-T/2, 0); // 侧板
      box(wf, T, df, bd, 0, 0);          box(wf, T, df, bd, 0, hf-T);     // 顶底
      for(let c=1;c<cols;c++) box(T, hf-2*T, df, bd, -wf/2 + wf*c/cols, T);
      for(let r=1;r<rows;r++) box(wf-2*T, T, df, bd, 0, hf*r/rows);
      break;
    }
    case 'bedMetal': {
      const mFrame=new THREE.MeshStandardMaterial({color:new THREE.Color(itemColor(it)), roughness:.35, metalness:.75});
      const mMat=new THREE.MeshStandardMaterial({color:0xeceae4, roughness:.85});
      const mSheet=new THREE.MeshStandardMaterial({color:0xf3f1ec, roughness:.9});
      const legH=cm2ft(26), matT=cm2ft(24);
      for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]])          // 四角管腿
        box(cm2ft(3.6), legH, cm2ft(3.6), mFrame, sx*(wf/2-cm2ft(3)), 0, sz*(df/2-cm2ft(3)));
      box(wf, cm2ft(4), cm2ft(4), mFrame, 0, legH-cm2ft(4), -df/2+cm2ft(2));   // 边框
      box(wf, cm2ft(4), cm2ft(4), mFrame, 0, legH-cm2ft(4),  df/2-cm2ft(2));
      box(cm2ft(4), cm2ft(4), df, mFrame, -wf/2+cm2ft(2), legH-cm2ft(4), 0);
      box(cm2ft(4), cm2ft(4), df, mFrame,  wf/2-cm2ft(2), legH-cm2ft(4), 0);
      for(let i=0;i<9;i++)                                          // 排骨架
        box(wf-cm2ft(6), cm2ft(1.6), cm2ft(6), mFrame, 0, legH-cm2ft(1.6), -df/2+cm2ft(12)+i*(df-cm2ft(24))/8);
      box(wf-cm2ft(1), matT, df-cm2ft(1), mMat, 0, legH);           // 床垫（与床架同尺寸）
      box(wf-cm2ft(1), cm2ft(1.2), df*0.62, mSheet, 0, legH+matT, df*0.19);  // 床单
      const ph=cm2ft(14), pw=(wf-cm2ft(14))/2;
      for(const sx of [-1,1])                                       // 枕头
        box(pw, ph, cm2ft(40), mSheet, sx*(pw/2+cm2ft(3)), legH+matT, -df/2+cm2ft(26));
      // 床头栏杆
      box(wf, cm2ft(3), cm2ft(3.6), mFrame, 0, legH+cm2ft(38), -df/2+cm2ft(2));
      for(let i=0;i<7;i++)
        box(cm2ft(2.2), cm2ft(38), cm2ft(2.2), mFrame, -wf/2+cm2ft(6)+i*(wf-cm2ft(12))/6, legH, -df/2+cm2ft(2));
      break;
    }
    case 'armchair': {
      const legH=cm2ft(17), seatH=cm2ft(spec.seatH||46), armW=cm2ft(13);
      for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]])
        legT(cm2ft(3.2), cm2ft(2.0), legH, matWood, sx*(wf/2-cm2ft(8)), sz*(df/2-cm2ft(8)), 0.06);
      rb(wf-cm2ft(2), seatH-legH-cm2ft(12), df-cm2ft(3), cm2ft(2.5), matFabD, 0, legH);
      for(const sx of [-1,1])                                               // 扶手（圆筒枕）
        rb(armW, cm2ft(20), df-cm2ft(4), cm2ft(6), matFab, sx*(wf/2-armW/2), seatH-cm2ft(6), 0, 4);
      cushion(wf-armW*2-cm2ft(2), cm2ft(14), df-cm2ft(20), matFab, 0, seatH-cm2ft(14), cm2ft(4));
      const bk=cushion(wf-armW*2-cm2ft(3), hf-seatH-cm2ft(4), cm2ft(16), matFab, 0, seatH, -df/2+cm2ft(11));
      bk.rotation.x=-0.11;
      break;
    }
    case 'bed': {
      box(wf, .9, df, matWhite);                       // 床箱
      box(wf-.2, .7, df-.3, new THREE.MeshStandardMaterial({color:0xfafafa,roughness:.9}), 0,.9,.05); // 床垫
      box(wf, hf-1.0, .25, mat, 0, 0, df/2-.12);       // 床头板(+y侧=局部front反向: 床头在-y? 造型: 床头在 -z 端)
      // 修正：床头板放在 -z 端
      g.children[g.children.length-1].position.z = -df/2+.12;
      box(wf*.4, .35, 1.0, new THREE.MeshStandardMaterial({color:0xeeeeee}), -wf*.22, 1.6, -df/2+1.0);
      box(wf*.4, .35, 1.0, new THREE.MeshStandardMaterial({color:0xeeeeee}), wf*.22, 1.6, -df/2+1.0);
      box(wf-.15, .25, df*.45, new THREE.MeshStandardMaterial({color:0x9aa8bd,roughness:.9}), 0, 1.55, df*.22);
      break;
    }
    case 'tableRound': {
      const top=new THREE.Mesh(new THREE.CylinderGeometry(wf/2,wf/2,.12,36), matWhite);
      top.position.y=hf; top.castShadow=true; g.add(top);
      cyl(.25, hf, matWhite, 0,0,0);
      cyl(wf/4, .08, matWhite, 0,0,0);
      break;
    }
    case 'tableRect': case 'desk': {
      box(wf, .14, df, kind==='desk'?matWhite:matWood, 0, hf-.14, 0);
      const lm = kind==='desk'? matMetal : matWood;
      [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,b])=>{
        const mm=new THREE.Mesh(new THREE.BoxGeometry(.12,hf-.14,.12),lm);
        mm.position.set(a*(wf/2-.15), (hf-.14)/2, b*(df/2-.15)); mm.castShadow=true; g.add(mm);
      });
      if(kind==='desk'){ box(1.5,.9,.1, matD, 0, hf, -df/2+.5); }
      break;
    }
    case 'chair': {
      box(wf,.1,df,matWood,0,1.45,0);
      box(wf,1.35,.1,matWood,0,1.55,-df/2+.05);
      [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,b])=>{
        const mm=new THREE.Mesh(new THREE.BoxGeometry(.08,1.45,.08),matWood);
        mm.position.set(a*(wf/2-.08),.72,b*(df/2-.08)); mm.castShadow=true; g.add(mm);
      });
      break;
    }
    case 'officeChair': {
      cyl(wf/2,.15,matD,0,1.2,0); box(wf*.9,1.4,.2,matD,0,1.5,-df/2+.15);
      cyl(.08,1.2,matMetal,0,0,0); cyl(wf/2.2,.06,matMetal,0,0,0);
      break;
    }
    case 'stool': {
      const sh = cm2ft(spec.seat||62);
      cyl(wf/2,.12, matD, 0, sh, 0);
      [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,b])=>{
        const mm=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,sh,10),matMetal);
        mm.position.set(a*wf/3, sh/2, b*df/3); mm.castShadow=true; g.add(mm);
      });
      break;
    }
    case 'coffeeTable': case 'sideTable': {
      const isRound = spec.w===spec.d;
      if(isRound){ const top=new THREE.Mesh(new THREE.CylinderGeometry(wf/2,wf/2,.1,32),mat); top.position.y=hf; top.castShadow=true; g.add(top);
        cyl(.12,hf,matMetal,-wf/5,0,0); cyl(.12,hf,matMetal,wf/5,0,-wf/6); cyl(.12,hf,matMetal,0,0,wf/5); }
      else { box(wf,.12,df,mat,0,hf-.12,0);
        [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,b])=>{
          const mm=new THREE.Mesh(new THREE.BoxGeometry(.1,hf-.12,.1),matD);
          mm.position.set(a*(wf/2-.12),(hf-.12)/2,b*(df/2-.12)); g.add(mm); }); }
      break;
    }
    case 'tvBench': {
      box(wf, hf, df, mat);
      box(Math.min(wf-.5,4.8), 2.5, .1, new THREE.MeshStandardMaterial({color:0x0a0a0c, roughness:.3}), 0, hf+.35, 0); // 电视
      break;
    }
    case 'dresser': case 'nightstand': case 'shoeCab': {
      box(wf,hf,df,mat);
      const n = kind==='nightstand'?2: Math.max(2,Math.round(hf/1.1));
      for(let i=0;i<n;i++){ box(wf-.15,.04,.02, matD, 0, (i+.6)*hf/n, df/2+.01); }
      break;
    }
    case 'bookcase': {
      box(wf,hf,df,mat);
      const shelves = Math.max(2,Math.round(hf/1.2));
      for(let i=1;i<shelves;i++) box(wf-.1,.05,df-.1, matD, 0, i*hf/shelves, .02);
      break;
    }
    case 'rug': {
      const mm = new THREE.Mesh(new THREE.BoxGeometry(wf,.06,df), new THREE.MeshStandardMaterial({color:col, roughness:1}));
      mm.position.y=.03; mm.receiveShadow=true; g.add(mm);
      break;
    }
    case 'lamp': {
      cyl(.5,.06,matD); cyl(.05,hf-1.1,matMetal);
      const shade = new THREE.Mesh(new THREE.CylinderGeometry(.55,.7,1.1,20,1,true), new THREE.MeshStandardMaterial({color:0xf5efdf, emissive:0x776a3f, emissiveIntensity:.6, side:THREE.DoubleSide}));
      shade.position.y = hf-.6; g.add(shade);
      const pt = new THREE.PointLight(0xffe8b8, .5, 14); pt.position.y=hf-.6; g.add(pt);
      break;
    }
    default: box(wf,hf,df,mat);
  }
  g.position.set(it.x, 0, it.y);
  g.rotation.y = -it.rot*Math.PI/180;
  return g;
}
function sync3D(){
  if(!three) return;
  three.furnGroup.traverse(o=>{ if(o.geometry) o.geometry.dispose();
    if(o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(m.map) m.map.dispose(); m.dispose(); }); } });
  three.furnGroup.clear();
  let lightBudget=6;                       // 只给前几盏灯开阴影，避免帧率崩塌
  for(const it of state.items){
    let spec=itemSpec(it); if(!spec) continue;
    if(isLight(spec) && lightBudget>0){ spec=Object.assign({},spec,{shadow:true}); lightBudget--; }
    three.furnGroup.add(furn3D(it,spec));
  }
  applyLightMode();
}

function setDoorWidth(newLenFt){
  const s=wallEdit.sel; if(!s||s.kind!=='door') return;
  const d=selDoor(); if(!d) return;
  const dx=d.x2-d.x1, dy=d.y2-d.y1, L=Math.hypot(dx,dy)||1e-6, u=[dx/L,dy/L];
  const link=doorLinkage(d, s);
  const moveEnd = (wallEdit.dEndSel!=null) ? wallEdit.dEndSel : (d.hinge?0:1);
  const rg=link.range(moveEnd);
  let L2=Math.max(DOOR_MIN, newLenFt);
  if(moveEnd===1){ L2=Math.min(L2, L+rg[1]); L2=Math.max(L2, Math.max(DOOR_MIN, L+rg[0])); }
  else           { L2=Math.min(L2, L-rg[0]); L2=Math.max(L2, Math.max(DOOR_MIN, L-rg[1])); }
  if(Math.abs(L2-L)<1e-9){ wMsg('已到墙垛允许的极限', true); return; }
  if(moveEnd===1) link.apply(d.x1,d.y1, d.x1+u[0]*L2, d.y1+u[1]*L2);
  else            link.apply(d.x2-u[0]*L2, d.y2-u[1]*L2, d.x2, d.y2);
  geoChanged(); updateWallBarFromSel();
  if(Math.abs(L2-Math.max(DOOR_MIN,newLenFt))>1e-6) wMsg('门宽已夹到墙垛允许范围：'+lenLabel(L2), true);
}
function nudgeDoor(signAlong, stepFt){ // 激活端点则改宽，否则整体滑动
  const s=wallEdit.sel; if(!s||s.kind!=='door') return false;
  const d=selDoor(); if(!d) return false;
  const dx=d.x2-d.x1, dy=d.y2-d.y1, L=Math.hypot(dx,dy)||1e-6, u=[dx/L,dy/L];
  let dd=stepFt*signAlong;
  const link=doorLinkage(d, s);
  const cl=(k,v)=>{ const r=link.range(k); return Math.max(r[0], Math.min(r[1], v)); };
  if(wallEdit.dEndSel===0){
    dd=cl(0,dd); if(L-dd<DOOR_MIN) dd=L-DOOR_MIN;
    if(Math.abs(dd)<1e-9) return true;
    link.apply(d.x1+u[0]*dd, d.y1+u[1]*dd, d.x2, d.y2);
  } else if(wallEdit.dEndSel===1){
    dd=cl(1,dd); if(L+dd<DOOR_MIN) dd=DOOR_MIN-L;
    if(Math.abs(dd)<1e-9) return true;
    link.apply(d.x1, d.y1, d.x2+u[0]*dd, d.y2+u[1]*dd);
  } else {
    dd=Math.max(link.range(0)[0], Math.min(link.range(1)[1], dd));
    if(Math.abs(dd)<1e-9) return true;
    link.apply(d.x1+u[0]*dd, d.y1+u[1]*dd, d.x2+u[0]*dd, d.y2+u[1]*dd);
  }
  geoChanged(); updateWallBarFromSel(); return true;
}

const EYE_H = 5.35;              // 人眼高度 ≈163cm
function setCamMode(m){
  if(!three) return;
  three.camMode=m;
  $('#camDoll').classList.toggle('on', m==='doll');
  $('#camFP').classList.toggle('on', m==='fp');
  const {cam, controls} = three;
  if(m==='fp'){
    const p=three.fpPos || new THREE.Vector3(22, EYE_H, 27);
    cam.position.copy(p);
    const dir = (three.fpDir || new THREE.Vector3(-0.75,-0.06,-0.66)).clone().normalize();
    three.fpYaw = Math.atan2(dir.x, dir.z);
    three.fpPitch = Math.asin(Math.max(-1,Math.min(1,dir.y)));
    // 第一人称：完全停用 OrbitControls（它会把俯仰夹到水平面并反推相机位置 → 转头时升高/翻向）
    controls.enabled=false;
    cam.fov=68; cam.updateProjectionMatrix();
    fpAim();
    $('#hint').innerHTML='室内视角：左键拖动=<b>原地转头</b> · <b>双击地面=走过去</b> · W/A/S/D=走动（Shift 加速）· 滚轮=前后 · 右键拖动=平移站位';
  } else {
    if(three.camMode!=='doll'){ three.fpPos=cam.position.clone();
      three.fpDir=controls.target.clone().sub(cam.position).normalize(); }
    controls.enabled=true;
    controls.enableRotate=true; controls.enablePan=true; controls.enableZoom=true;
    controls.minDistance=0; controls.maxDistance=Infinity;
    controls.maxPolarAngle=Math.PI/2-0.02;
    cam.fov=55; cam.updateProjectionMatrix();
    cam.position.set(28, 42, 50); controls.target.set(26,0,20);
    $('#hint').innerHTML='左键拖动=环绕 · <b>Shift+左键 / 右键 = 平移</b> · 滚轮=缩放 · 家具编辑请回到 2D 平面';
  }
  applyBackdrop(); applyLightMode();
  controls.update();
}
/* 第一人称：只改朝向，站立位置不动（OrbitControls 是绕目标公转，会把人挪走） */
function fpAim(){
  if(!three) return;
  const {cam, controls}=three;
  const y=three.fpYaw||0, p=three.fpPitch||0;
  const dir=new THREE.Vector3(Math.sin(y)*Math.cos(p), Math.sin(p), Math.cos(y)*Math.cos(p));
  cam.up.set(0,1,0);
  cam.lookAt(cam.position.x+dir.x, cam.position.y+dir.y, cam.position.z+dir.z);  // 直接定朝向
  controls.target.copy(cam.position).addScaledVector(dir, 6);                     // 仅为切回娃娃屋时保持连续
  three.fpDir=dir.clone();
  return dir;
}
function fpForward(){ const y=three.fpYaw||0;
  return new THREE.Vector3(Math.sin(y),0,Math.cos(y)).normalize(); }
/* 点是否在户型内（含阳台），用于限制漫游范围 */
function insideFloorPt(x,z){
  const test=(poly)=>{ let inside=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
      if((yi>z)!==(yj>z) && x<(xj-xi)*(z-yi)/(yj-yi)+xi) inside=!inside; }
    return inside; };
  return test(FLOORPTS) || test(PATIO);
}
/* 街景式：双击地面走过去（保持朝向，平滑移动） */
function walkTo(x,z){
  if(!three) return;
  const cam=three.cam, from=cam.position.clone(), to=new THREE.Vector3(x, EYE_H, z);
  const dist=from.distanceTo(to);
  const dur=Math.min(900, 260+dist*45);
  const t0=performance.now();
  if(three.walk){ clearInterval(three.walk.iv); three.walk.cancel=true; }
  const ease=t=>t<.5? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
  const anim={cancel:false};
  // 用定时器而非 rAF 驱动：页面无合成帧时 rAF 会被饿死，动画卡在原地
  anim.iv=setInterval(()=>{
    if(anim.cancel){ clearInterval(anim.iv); return; }
    const t=Math.min(1,(performance.now()-t0)/dur);
    cam.position.lerpVectors(from, to, ease(t));
    cam.position.y=EYE_H;
    fpAim();
    if(t>=1){ clearInterval(anim.iv); three.walk=null; }
  }, 16);
  three.walk=anim;
}
(function installFPLook(){
  const canvas=$('#c3d'); if(!canvas) return;
  let drag=null;
  canvas.addEventListener('dblclick', e=>{      // 双击地面=走过去（Google 街景逻辑）
    if(!three || three.camMode!=='fp' || state.view!=='3d') return;
    const r=canvas.getBoundingClientRect();
    const ndc=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
    three.cam.updateMatrixWorld(true);      // 射线必须基于最新的相机矩阵
    const rc=new THREE.Raycaster(); rc.setFromCamera(ndc, three.cam);
    const hit=new THREE.Vector3();
    if(!rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0), hit)) return;
    if(!insideFloorPt(hit.x,hit.z)){ return; }   // 不走到户型外
    e.preventDefault(); walkTo(hit.x, hit.z);
  });
  canvas.addEventListener('pointerdown', e=>{
    if(!three || three.camMode!=='fp' || state.view!=='3d') return;
    drag={x:e.clientX, y:e.clientY, btn:e.button};
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  });
  canvas.addEventListener('pointermove', e=>{
    if(!drag || !three || three.camMode!=='fp') return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    drag.x=e.clientX; drag.y=e.clientY;
    if(drag.btn===2){                       // 右键=平移站位（贴地滑动）
      const f=fpForward(), r=new THREE.Vector3().crossVectors(f,new THREE.Vector3(0,1,0)).normalize();
      const mv=new THREE.Vector3().addScaledVector(r,-dx*0.012).addScaledVector(f, dy*0.012);
      three.cam.position.add(mv); three.cam.position.y=EYE_H;
    } else {                                // 左键=原地转头（与娃娃屋一致的"抓住场景拖动"手感）
      three.fpYaw   += dx*0.0045;
      three.fpPitch  = Math.max(-1.25, Math.min(1.25, three.fpPitch + dy*0.0045));
    }
    fpAim();
  });
  const end=e=>{ if(drag){ drag=null; try{ canvas.releasePointerCapture(e.pointerId); }catch(_){} } };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('wheel', e=>{     // 滚轮=前后走，而不是拉远拉近
    if(!three || three.camMode!=='fp' || state.view!=='3d') return;
    e.preventDefault();
    three.cam.position.addScaledVector(fpForward(), (e.deltaY>0?-1:1)*0.55);
    three.cam.position.y=EYE_H;
    fpAim();
  }, {passive:false});
})();
/* 漫游走动 */
const fpKeys={};
window.addEventListener('keydown', e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  if(!three || three.camMode!=='fp' || state.view!=='3d') return;
  const k=e.key.toLowerCase();
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ fpKeys[k]=true; e.preventDefault(); }
});
window.addEventListener('keyup', e=>{ fpKeys[e.key.toLowerCase()]=false; });
function fpStep(){
  if(!three || three.camMode!=='fp') return;
  const any=['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].some(k=>fpKeys[k]);
  if(!any) return;
  const {cam}=three;
  const fwd=fpForward();
  const right=new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
  const sp=(fpKeys['shift']?0.34:0.14);
  const mv=new THREE.Vector3();
  if(fpKeys['w']||fpKeys['arrowup'])    mv.addScaledVector(fwd, sp);
  if(fpKeys['s']||fpKeys['arrowdown'])  mv.addScaledVector(fwd,-sp);
  if(fpKeys['a']||fpKeys['arrowleft'])  mv.addScaledVector(right,-sp);
  if(fpKeys['d']||fpKeys['arrowright']) mv.addScaledVector(right, sp);
  cam.position.add(mv); cam.position.y=EYE_H;
  fpAim();
}

/* 导出图片 */
$('#btnExport').onclick=()=>{
  if(state.view==='3d' && three){
    const a=document.createElement('a'); a.href=three.renderer.domElement.toDataURL('image/png');
    a.download='3D渲染.png'; a.click(); return;
  }
  // 序列化时内嵌样式（页面CSS不会随SVG导出）
  const r=svg.getBoundingClientRect();
  const clone = svg.cloneNode(true);
  const st = document.createElementNS(NS,'style');
  st.textContent = `.wall{stroke:#0c0d0f;stroke-linecap:square}.glass{stroke:#7fb8ff}
    .roomlabel{fill:#8b929b;font-size:13px;text-anchor:middle}.roomlabel tspan.dim{font-size:11px;fill:#6b727b}
    .dimlabel{fill:#5d646e;font-size:9.5px;text-anchor:middle}
    text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}`;
  clone.insertBefore(st, clone.firstChild);
  clone.setAttribute('width', r.width*2); clone.setAttribute('height', r.height*2);
  const ser = new XMLSerializer().serializeToString(clone);
  const img = new Image();
  const blob = new Blob([ser],{type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  img.onload=()=>{
    const c=document.createElement('canvas');
    c.width=r.width*2; c.height=r.height*2;
    const g=c.getContext('2d'); g.fillStyle='#101215'; g.fillRect(0,0,c.width,c.height);
    g.drawImage(img,0,0,c.width,c.height);
    try{ const a=document.createElement('a'); a.href=c.toDataURL('image/png'); a.download='2D平面布局.png'; a.click(); }
    catch(e){ alert('导出失败，请直接截图。'); }
    URL.revokeObjectURL(url);
  };
  img.onerror=()=>{ alert('导出失败，请直接截图。'); URL.revokeObjectURL(url); };
  img.src=url;
  // 提示：自定义家具的外链图片不会出现在导出的PNG里（浏览器安全限制）
};
